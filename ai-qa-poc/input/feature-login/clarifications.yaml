# Clarification ledger — sign-in
#
# Questions the Thinking Agent raised against requirement.md, and the answers.
# See VISION section 4a.
#
# status:
#   open      nobody has answered. Any intent depending on this CANNOT pass Gate 1.
#   answered  confirmed by a human who is entitled to decide.
#   assumed   we could not wait. Allowed, but every intent resting on it is
#             stamped assumption: true, and that rides into the run report.
#
# Answer from the CLI rather than by hand, so who/when is stamped and any
# already-approved intent resting on the old answer is flagged:
#   npm run clarify -- --feature login --answer Q-1 --text "..." --by "your name"

feature: login

questions:
  - id: Q-1
    question: >-
      What happens after N consecutive failed sign-in attempts — lockout,
      CAPTCHA, or a progressive delay? What is N, and how long does it last?
    why: >-
      R-3 says only that brute force must not be possible. LG-004 asserts a
      specific lockout behaviour, which the requirement never states. Without an
      answer the test would be grading the product against a rule we invented.
    status: answered
    answer: "Locked for 15 minutes after 5 consecutive failures. A correct password
      during the window is still refused."
    raised_at: 2026-09-12
    requirement_ref: input/feature-login/requirement.md#r-3--repeated-failures
    answered_by: jay.r
    answered_at: 2026-09-12T13:41:39.831Z

  - id: Q-2
    question: >-
      Does the error for a wrong password differ from the error for an email
      that is not registered?
    why: >-
      Two different messages is a user-enumeration weakness; one message is a
      usability cost. Either is a defensible product decision, but LG-002 has to
      assert one of them, and guessing means the test enforces a security
      posture nobody chose.
    status: answered
    answer: >-
      One identical message for both cases: "That email and password do not
      match." Deliberate, to avoid confirming which addresses are registered.
    answered_by: jay.r
    answered_at: 2026-09-12T09:15:00.000Z
    requirement_ref: input/feature-login/requirement.md#r-2--wrong-credentials

  - id: Q-3
    question: How long does "stay signed in" keep the session alive?
    why: >-
      R-4 states the option exists but not what it does. A test can confirm the
      option is offered without this; it cannot confirm the option works.
    status: assumed
    answer: >-
      Assume 30 days until Product confirms. Recorded as an assumption — LG-006
      is stamped accordingly and a FAIL there may mean this guess was wrong
      rather than the product.
    answered_by: jay.r
    answered_at: 2026-09-12T09:20:00.000Z
    requirement_ref: input/feature-login/requirement.md#r-4--stay-signed-in
